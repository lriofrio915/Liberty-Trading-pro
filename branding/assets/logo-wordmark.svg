<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-label="Luis Riofrio — Asesor de Inversiones">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A7A30"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8C96A"/>
    </linearGradient>
  </defs>

  <!-- Wordmark: Cormorant Garamond italic 300 -->
  <text x="360" y="96"
        text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-style="italic" font-weight="300" font-size="76"
        letter-spacing="-1.5"
        fill="url(#gold)">Luis Riofrio</text>

  <!-- Regla dorada -->
  <rect x="230" y="122" width="260" height="1.5" fill="#C9A84C" opacity="0.55"/>

  <!-- Descriptor: DM Mono uppercase -->
  <text x="360" y="158"
        text-anchor="middle"
        font-family="'DM Mono', ui-monospace, monospace"
        font-size="19" letter-spacing="7"
        fill="#8a8480">ASESOR DE INVERSIONES</text>
</svg>
