  <rect x="36" y="36" width="1728" height="1128" fill="none" stroke="#C9A84C" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="18 14" rx="16"/>

  <text x="640" y="1010" text-anchor="middle" font-family="'DM Mono', ui-monospace, monospace" font-size="44" letter-spacing="7" fill="url(#g)">FOTO PENDIENTE</text>
  <text x="640" y="1070" text-anchor="middle" font-family="'DM Mono', ui-monospace, monospace" font-size="28" letter-spacing="5" fill="#8a8480">03 · ESCRITORIO · 3:2 · 1800×1200</text>
</svg>
