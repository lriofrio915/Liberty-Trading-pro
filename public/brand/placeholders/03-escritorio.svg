<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-label="Foto pendiente: Luis Riofrio en su escritorio de trading">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A7A30"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8C96A"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1800" height="1200" fill="#111111"/>
  <rect width="1800" height="1200" fill="url(#glow)"/>

  <!-- Monitores -->
  <g fill="#161616" stroke="#1e1e1e" stroke-width="4">
    <rect x="220" y="300" width="480" height="300" rx="10"/>
    <rect x="730" y="300" width="480" height="300" rx="10"/>
  </g>
  <!-- Velas abstractas desenfocadas -->
  <g stroke="#C9A84C" stroke-opacity="0.30" stroke-width="10" stroke-linecap="round">
    <path d="M290 520 L290 420"/><path d="M340 540 L340 460"/><path d="M390 470 L390 380"/>
    <path d="M440 500 L440 410"/><path d="M490 450 L490 350"/><path d="M540 490 L540 400"/>
    <path d="M590 430 L590 340"/><path d="M640 470 L640 390"/>
  </g>
  <g stroke="#00C896" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round">
    <path d="M800 530 L800 440"/><path d="M850 500 L850 400"/><path d="M900 460 L900 370"/>
    <path d="M950 490 L950 400"/><path d="M1000 430 L1000 350"/><path d="M1050 470 L1050 380"/>
    <path d="M1100 420 L1100 340"/><path d="M1150 450 L1150 370"/>
  </g>

  <!-- Escritorio -->
  <rect x="120" y="640" width="1180" height="16" rx="8" fill="#1e1e1e"/>

  <!-- Silueta a la derecha, de espaldas tres cuartos -->
