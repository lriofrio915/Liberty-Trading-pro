# FinGPT inference service — Fly.io config
# GPU machine: L40S (48GB VRAM) — sufficient for BLOOM-7B in 4-bit (~4GB VRAM)

app = "liberty-fingpt"
primary_region = "ewr"  # Secaucus NJ — mejor disponibilidad GPU A10

[build]
  dockerfile = "Dockerfile"

[env]
  MODEL_CACHE_DIR = "/cache"
  PORT = "8080"

[[mounts]]
  source = "fingpt_model_cache"
  destination = "/cache"
  initial_size = "50gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true      # scale to zero when idle
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "10s"

  [http_service.concurrency]
    type = "requests"
    hard_limit = 10
    soft_limit = 5

[[vm]]
  # GPU (activo cuando billing@fly.io habilite GPU en la cuenta):
  size = "a10"
  memory = "32gb"
  cpus = 8
  # CPU fallback (si GPU no disponible, cambiar a estas líneas):
  # size = "performance-8x"
  # memory = "32768"
