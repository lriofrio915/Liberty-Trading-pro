name: Cron — Morning Agents 9am Ecuador

on:
  workflow_dispatch:

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar pipeline morning agents (5 agentes AI)
        run: |
          HTTP=$(curl -sSL -o /tmp/response.txt -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/morning-agents")
          echo "HTTP status: $HTTP"
          cat /tmp/response.txt || true
          if [ "$HTTP" != "200" ]; then
            echo "Error: expected 200, got $HTTP"
            exit 1
          fi
