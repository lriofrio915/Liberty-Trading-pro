name: Cron — Scan Price Update 3pm ET

on:
  schedule:
    - cron: '0 20 * * 1-5'  # 20:00 UTC = 3pm EST / 4pm EDT (Mon-Fri)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update 3pm prices
        run: |
          HTTP=$(curl -sSL -o /tmp/response.txt -w "%{http_code}" \
            "${{ secrets.APP_URL }}/api/cron/scan-prices?checkpoint=3pm&secret=${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $HTTP"
          cat /tmp/response.txt || true
          if [ "$HTTP" != "200" ]; then
            echo "Error: expected 200, got $HTTP"
            exit 1
          fi
