name: Cron — Peter Lynch Screener Refresh

on:
  schedule:
    - cron: '0 10 * * 1-5'  # 10:00 UTC (5am ET) Mon-Fri
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger screener refresh
        run: |
          HTTP=$(curl -sSL -o /tmp/response.txt -w "%{http_code}" \
            "${{ secrets.APP_URL }}/api/screener/lynch?refresh=true&secret=${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $HTTP"
          cat /tmp/response.txt || true
          if [ "$HTTP" != "200" ]; then
            echo "Error: expected 200, got $HTTP"
            exit 1
          fi