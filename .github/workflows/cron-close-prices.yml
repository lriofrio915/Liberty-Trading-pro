name: Close Prices (3pm ET)

on:
  schedule:
    - cron: "0 19 * * 1-5"   # 3:00pm ET = 19:00 UTC (EDT, mar-nov)
    - cron: "0 20 * * 1-5"   # 3:00pm ET = 20:00 UTC (EST, nov-mar)
  workflow_dispatch:

jobs:
  close-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capturar precios de cierre
        run: |
          echo "Llamando /api/cron/close-prices..."
          RESPONSE=$(curl -s -L -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "https://www.libertytrading.pro/api/cron/close-prices" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")

          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: El cron respondió con status $HTTP_STATUS"
            exit 1
          fi
