name: Cron — MT5 Queue Signals 09:05am ET

on:
  schedule:
    - cron: '5 14 * * 1-5'  # 14:05 UTC = 09:05am EST / 10:05am EDT (Mon-Fri)
  workflow_dispatch:

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - name: Queue auto-trade signals from morning scan
        run: |
          HTTP=$(curl -sSL -o /tmp/response.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            "${{ secrets.APP_URL }}/api/mt5/queue-signals")
          echo "HTTP status: $HTTP"
          cat /tmp/response.txt || true
          if [ "$HTTP" != "200" ]; then
            echo "Error: expected 200, got $HTTP"
            exit 1
          fi
